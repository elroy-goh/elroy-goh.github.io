---
layout: default
---

<!-- Inject custom stylesheet. al-folio's current head.liquid has no hook for
     user CSS, so we load it here. HTML5 allows <link> in <body> and all
     browsers apply it correctly. -->
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

<div class="post">
  {%- if page.title and page.title != "" %}
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {%- if page.description %}
    <p class="post-description">{{ page.description }}</p>
    {%- endif %}
  </header>
  {%- endif %}

  <article class="post-content">
    {{ content }}
  </article>
</div>
